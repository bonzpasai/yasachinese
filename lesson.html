<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ບົດຮຽນ | ຄູຢາຊາ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Lao',sans-serif;color:var(--ink);min-height:100vh}
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px)}
.tab{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:.6rem 1.3rem;border-radius:50px;border:2px solid #C9D9F0;cursor:pointer;transition:.2s;font-family:inherit;font-size:.88rem;background:#fff;color:var(--gray);white-space:nowrap}
.tab.active{background:var(--red);color:#fff}
.lcard{background:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;transition:.22s}
.lcard:hover{transform:translateY(-2px)}
.num{width:30px;height:30px;border-radius:50%;flex-shrink:0;font-size:.78rem;display:flex;align-items:center;justify-content:center;margin-top:3px}
.empty{text-align:center;padding:72px 20px;background:#fff;border-radius:20px;border:2px dashed #C9D9F0}
.btn-back{display:inline-flex;align-items:center;gap:6px;color:var(--gray);font-weight:600;font-size:.85rem;text-decoration:none;padding:.4rem .8rem;border-radius:8px;transition:.18s}
.btn-back:hover{background:var(--red-dim);color:var(--red)}
.level-hero{border-radius:20px;padding:24px 28px;color:#fff;position:relative;overflow:hidden;margin-bottom:28px}
.level-hero .deco-char{font-size:8rem;line-height:1;position:absolute;right:-10px;bottom:-24px;color:rgba(255,255,255,.12);pointer-events:none;user-select:none}
.level-hero .yl{color:var(--yellow)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .4s ease both}
@media(max-width:480px){.tab{padding:.5rem .9rem;font-size:.8rem}.lcard{padding:14px 15px;gap:10px}.level-hero{padding:18px 20px}.level-hero .deco-char{font-size:5.5rem}}
</style>
<link rel="stylesheet" href="theme.css"/>
</head>
<body>

<nav>
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
    <a href="index.html" class="btn-back">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      <span class="hidden sm:inline">ກັບໄປໜ້າຫຼັກ</span><span class="sm:hidden">ກັບ</span>
    </a>
    <span class="font-semibold text-sm" style="color:var(--gray)">ຄັງຄວາມຮູ້ · ບົດຮຽນ</span>
    <span id="count-badge" style="background:var(--yellow);color:var(--blue-dk);font-size:.74rem;font-weight:800;padding:.25rem .8rem;border-radius:50px;white-space:nowrap">0 ບົດ</span>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex gap-2 sm:gap-3 flex-wrap mb-6">
    <button class="tab" id="tab-beginner" onclick="switchLevel('beginner')"><span class="font-cn">初级</span>ເລີ່ມຕົ້ນ</button>
    <button class="tab" id="tab-intermediate" onclick="switchLevel('intermediate')"><span class="font-cn">中级</span>ສົນທະນາ</button>
    <button class="tab" id="tab-advanced" onclick="switchLevel('advanced')"><span class="font-cn">高级</span>HSK</button>
  </div>

  <div class="level-hero fade-up">
    <p style="font-size:.7rem;font-weight:800;letter-spacing:.1em;margin-bottom:4px" class="yl">LEVEL</p>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span class="font-cn" id="hero-cn" style="font-size:2.4rem;line-height:1.1">初级</span>
      <span id="hero-label" style="font-size:1.05rem;font-weight:700">ລະດັບເລີ່ມຕົ້ນ</span>
    </div>
    <p id="hero-hsk" style="font-size:.8rem;margin-top:4px;opacity:.85">HSK 1–2</p>
    <div class="deco-char font-cn" id="hero-deco">初</div>
  </div>

  <div id="lesson-list" class="flex flex-col gap-3"></div>

  <div id="lesson-empty" class="empty hidden">
    <p style="font-size:3.5rem;margin-bottom:12px">📖</p>
    <p class="font-bold text-lg">ຍັງບໍ່ມີບົດຮຽນ</p>
    <p class="text-sm mt-2" style="color:var(--gray)">ຄູຈະເພີ່ມໃຫ້ໃນໄວໆນີ້ 🙏</p>
  </div>
</main>

<footer class="text-center py-5 text-xs mt-6">
  <span class="font-cn">学而不思则罔</span> &nbsp;·&nbsp; ຄູຢາຊາ · ສອນພາສາຈີນ
</footer>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAmgsjdFA3bPASyuusrGWADXOUi2ZYSeT1w_a2G02a4U8jKx_TT_K2ijZj7k40bEg/exec';
  const DB_KEY = 'kru_lessons';
  const LEVELS = {
    beginner:{cn:'初级',deco:'初',label:'ລະດັບເລີ່ມຕົ້ນ',hsk:'HSK 1–2'},
    intermediate:{cn:'中级',deco:'中',label:'ລະດັບສົນທະນາ',hsk:'HSK 3–4'},
    advanced:{cn:'高级',deco:'高',label:'ກຽມສອບ HSK',hsk:'HSK 4–5'}
  };
  const params = new URLSearchParams(location.search);
  let cur = params.get('level') || 'beginner';
  if (!LEVELS[cur]) cur = 'beginner';
  let lessonData = [];

  function getLocalLessons(){ try{return JSON.parse(localStorage.getItem(DB_KEY)||'[]')}catch(e){return []} }
  function parseLessons(data){ try{ const p=JSON.parse((data&&data.lessons)||'[]'); return Array.isArray(p)?p:[] }catch(e){return []} }

  async function loadLessons(){
    if(!WEB_APP_URL || WEB_APP_URL.includes('PASTE_YOUR')){ lessonData=getLocalLessons(); render(); return; }
    try{
      const res=await fetch(WEB_APP_URL+'?t='+Date.now());
      const json=await res.json();
      if(!json.ok) throw new Error(json.error||'Load failed');
      lessonData=parseLessons(json.data);
      if(!lessonData.length) lessonData=getLocalLessons();
    }catch(err){ console.warn('Google lesson load error:',err); lessonData=getLocalLessons(); }
    render();
  }

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function render(){
    const list=document.getElementById('lesson-list'), empty=document.getElementById('lesson-empty'), meta=LEVELS[cur];
    document.getElementById('hero-cn').textContent=meta.cn;
    document.getElementById('hero-label').textContent=meta.label;
    document.getElementById('hero-hsk').textContent=meta.hsk;
    document.getElementById('hero-deco').textContent=meta.deco;
    document.title=meta.cn+' '+meta.label+' | ຄູຢາຊາ';
    Object.keys(LEVELS).forEach(lv=>document.getElementById('tab-'+lv).classList.toggle('active',lv===cur));
    const filtered=lessonData.filter(l=>l.level===cur);
    document.getElementById('count-badge').textContent=filtered.length+' ບົດ';
    list.innerHTML='';
    if(!filtered.length){ empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    filtered.forEach((lesson,i)=>{
      const card=document.createElement('div');
      card.className='lcard fade-up';
      card.style.animationDelay=Math.min(i,5)*.05+'s';
      card.innerHTML='<div class="num">'+(i+1)+'</div><div style="flex:1;min-width:0"><p style="font-weight:700;font-size:.96rem;line-height:1.45;margin-bottom:6px">'+esc(lesson.title)+'</p>'+(lesson.desc?'<p style="font-size:.84rem;color:var(--gray);white-space:pre-wrap;line-height:1.75">'+esc(lesson.desc)+'</p>':'')+'</div>';
      list.appendChild(card);
    });
  }

  function switchLevel(lv){ cur=lv; history.replaceState(null,'','?level='+lv); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  loadLessons();
</script>
</body>
</html>
